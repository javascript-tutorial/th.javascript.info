<script>
  async function* fetchCommits(repo) {
    let url = `https://api.github.com/repos/${repo}/commits`;

    while (url) {
      const response = await fetch(url, {
        headers: {'User-Agent': 'Our script'}, // github ต้องการ user-agent header
      });

      const body = await response.json(); // แปลง response เป็น JSON (อาร์เรย์ของ commits)

      // URL ของหน้าถัดไปอยู่ใน header ดึงออกมา
      let nextPage = response.headers.get('Link').match(/<(.*?)>; rel="next"/);
      nextPage = nextPage?.[1];

      url = nextPage;

      // yield commit ทีละตัว พอหมดหน้าก็ดึง URL หน้าใหม่
      for(let commit of body) {
        yield commit;
      }
    }
  }
</script>
